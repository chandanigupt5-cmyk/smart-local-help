<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind CSS Carousel</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <!-- Carousel -->
    <div class="relative w-full max-w-5xl mx-auto mt-10 overflow-hidden rounded-2xl shadow-lg">

        <!-- Slides -->
        <div id="carousel" class="flex transition-transform duration-500 ease-in-out">

            <!-- Slide 1 -->
            <div class="min-w-full relative">
                <img
                    src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                    class="w-full h-96 object-cover"
                    alt="Mountain"
                >

                <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                    <div class="text-center text-white">
                        <h2 class="text-4xl font-bold mb-3">
                            Beautiful Mountain
                        </h2>
                        <p class="text-lg">
                            Explore the beauty of nature
                        </p>
                    </div>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="min-w-full relative">
                <img
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                    class="w-full h-96 object-cover"
                    alt="Beach"
                >

                <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                    <div class="text-center text-white">
                        <h2 class="text-4xl font-bold mb-3">
                            Amazing Beach
                        </h2>
                        <p class="text-lg">
                            Enjoy your perfect vacation
                        </p>
                    </div>
                </div>
            </div>

            <!-- Slide 3 -->
            <div class="min-w-full relative">
                <img
                    src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                    class="w-full h-96 object-cover"
                    alt="Forest"
                >

                <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                    <div class="text-center text-white">
                        <h2 class="text-4xl font-bold mb-3">
                            Green Forest
                        </h2>
                        <p class="text-lg">
                            Feel the freshness of nature
                        </p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Previous Button -->
        <button
            onclick="prevSlide()"
            class="absolute left-4 top-1/2 -translate-y-1/2
                   bg-white/80 hover:bg-white
                   text-gray-800 w-10 h-10 rounded-full
                   flex items-center justify-center
                   shadow-md transition"
        >
            ❮
        </button>

        <!-- Next Button -->
        <button
            onclick="nextSlide()"
            class="absolute right-4 top-1/2 -translate-y-1/2
                   bg-white/80 hover:bg-white
                   text-gray-800 w-10 h-10 rounded-full
                   flex items-center justify-center
                   shadow-md transition"
        >
            ❯
        </button>

        <!-- Dots -->
        <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-2">

            <button
                onclick="goToSlide(0)"
                class="dot w-3 h-3 rounded-full bg-white"
            ></button>

            <button
                onclick="goToSlide(1)"
                class="dot w-3 h-3 rounded-full bg-white/50"
            ></button>

            <button
                onclick="goToSlide(2)"
                class="dot w-3 h-3 rounded-full bg-white/50"
            ></button>

        </div>

    </div>


    <script>

        let currentSlide = 0;

        const carousel = document.getElementById("carousel");
        const dots = document.querySelectorAll(".dot");

        function updateCarousel() {

            carousel.style.transform =
                `translateX(-${currentSlide * 100}%)`;

            dots.forEach((dot, index) => {

                if (index === currentSlide) {
                    dot.classList.remove("bg-white/50");
                    dot.classList.add("bg-white");
                } else {
                    dot.classList.remove("bg-white");
                    dot.classList.add("bg-white/50");
                }

            });
        }


        function nextSlide() {

            currentSlide++;

            if (currentSlide >= 3) {
                currentSlide = 0;
            }

            updateCarousel();
        }


        function prevSlide() {

            currentSlide--;

            if (currentSlide < 0) {
                currentSlide = 2;
            }

            updateCarousel();
        }


        function goToSlide(index) {

            currentSlide = index;

            updateCarousel();
        }


        // Automatic Slide
        setInterval(nextSlide, 4000);

    </script>

</body>
</html>
